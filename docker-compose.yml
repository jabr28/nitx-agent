# Everything for the Campaign Agent demo: mock platform, two MCP servers, n8n.
# Secrets come from .env (create it with: ./scripts/init-env.sh).
x-mcp-common: &mcp
  build: .
  restart: unless-stopped
  depends_on: [platform]
  environment: &mcp-env
    POSTER_API_KEY: ${NITX_DEMO_API_KEY:?run ./scripts/init-env.sh first}
    POSTER_API_BASE_URL: http://platform:8080
    # 40/hour is the production-style default; the full eval suite (42 runs) needs more.
    POSTER_MAX_IMAGES_PER_HOUR: ${POSTER_MAX_IMAGES_PER_HOUR:-300}
    LOG_LEVEL: INFO

services:
  platform:
    build: .
    command: ["nitx-mock-platform"]
    restart: unless-stopped
    environment:
      MOCK_HOST: 0.0.0.0
      MOCK_PORT: "8080"
      MOCK_API_KEYS: demo:${NITX_DEMO_API_KEY},rival:${NITX_RIVAL_API_KEY}
      APPROVER_TOKEN: ${APPROVER_TOKEN}
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      PLATFORM_PUBLIC_URL: http://localhost:8080
      MOCK_CDN_BASE: http://localhost:8080/cdn
      MOCK_MIN_SECONDS: ${MOCK_MIN_SECONDS:-5}
      MOCK_MAX_SECONDS: ${MOCK_MAX_SECONDS:-20}
      MOCK_FAIL_RATE: ${MOCK_FAIL_RATE:-0.1}
    ports: ["127.0.0.1:8080:8080"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 5s
      retries: 10

  poster-mcp:
    <<: *mcp
    command: ["poster-mcp", "--transport", "http", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      <<: *mcp-env
      MCP_ALLOWED_HOSTS: poster-mcp:8000
    ports: ["127.0.0.1:8000:8000"]

  campaign-mcp:
    <<: *mcp
    command: ["campaign-mcp", "--transport", "http", "--host", "0.0.0.0", "--port", "8001"]
    environment:
      <<: *mcp-env
      MCP_ALLOWED_HOSTS: campaign-mcp:8001
    ports: ["127.0.0.1:8001:8001"]

  n8n-init:
    image: n8nio/n8n:2.42.6
    entrypoint: ["/bin/sh", "/init.sh"]
    environment: &n8n-env
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      GENERIC_TIMEZONE: Asia/Riyadh
      TZ: Asia/Riyadh
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_SECURE_COOKIE: "false"
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      NITX_DEMO_API_KEY: ${NITX_DEMO_API_KEY}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/init.sh:/init.sh:ro
      - ./n8n/workflows:/workflows:ro

  n8n:
    image: n8nio/n8n:2.42.6
    restart: unless-stopped
    depends_on:
      n8n-init: {condition: service_completed_successfully}
      platform: {condition: service_healthy}
      poster-mcp: {condition: service_started}
      campaign-mcp: {condition: service_started}
    environment:
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      GENERIC_TIMEZONE: Asia/Riyadh
      TZ: Asia/Riyadh
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_SECURE_COOKIE: "false"
    ports: ["127.0.0.1:5678:5678"]
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  n8n_data:
